          # MAINTAINED config file keyed by the target env's first host label — never copied
          # from source. Secret-type vars carry @Microsoft.KeyVault(...) REFERENCES only.
          # gen-deployment-settings.sh fail-louds if a declared var has no target value.
          # Invoke via `bash` so the checked-out .sh does not need the +x execute bit.
