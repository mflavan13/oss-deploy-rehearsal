                     DeploymentSettings.json | sort -u)
          if [ -z "$WANTED" ]; then
            echo "::error::OI-5: no ConnectionIds present in DeploymentSettings.json — refusing to import blind"
            exit 1
          fi
          echo "OI-5 hard gate OK: DeploymentSettings.json carries ConnectionId(s):"
          echo "$WANTED"

          # ── advisory from here down — never fails the job ──
          if ! command -v pac >/dev/null 2>&1; then
            PAC_BIN="$(find "${POWERPLATFORMTOOLS_PACPATH:-/tmp}" -type f -name pac 2>/dev/null | head -1 || true)"
            if [ -z "$PAC_BIN" ]; then
              echo "::warning::OI-5 advisory: pac CLI not found — skipping the resolve check (the import is the authoritative gate)"
              exit 0
            fi
            export PATH="$(dirname "$PAC_BIN"):$PATH"
          fi
          if ! pac auth create \
                --applicationId "$PP_APP_ID" \
                --clientSecret  "$PP_CLIENT_SECRET" \
                --tenant        "$PP_TENANT_ID" \
                --environment   "$TARGET_URL" \
                --accept-cleartext-caching; then
            echo "::warning::OI-5 advisory: pac auth failed — skipping the resolve check (the import is the authoritative gate)"
            exit 0
          fi

          # What the deploy SP can SEE in the target (its OWN connections only — caller-scoped).
          if ! pac connection list --environment "$TARGET_URL" > pac-conns.txt 2>&1; then
            echo "::warning::OI-5 advisory: 'pac connection list' failed in target $TARGET_URL — skipping the resolve check"
            cat pac-conns.txt || true
            exit 0
          fi
          cat pac-conns.txt

