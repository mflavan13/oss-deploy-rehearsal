            ./deploymentSettings.skeleton.json \
            bindings.json \
            DeploymentSettings.json \
            "./config/env-vars.${ENVKEY}.json"
          cat DeploymentSettings.json

      - uses: microsoft/powerplatform-actions/actions-install@0e44beb5424af932af47250a2568eba4c259e3d8   # v1

      # Rationale + hard/advisory split: see the "OI-5 preflight" block comment above the import-* jobs.
      - name: OI-5 preflight — ConnectionIds present (hard) + resolve check (advisory)
        shell: bash
        env:
          PP_APP_ID:        ${{ secrets.PP_APP_ID }}
          PP_CLIENT_SECRET: ${{ secrets.PP_CLIENT_SECRET }}
          PP_TENANT_ID:     ${{ secrets.PP_TENANT_ID }}
          TARGET_URL:       ${{ secrets.PP_URL_STAGE }}
        run: |
          set -euo pipefail
          # Every ConnectionId the app bound into THIS hop's DeploymentSettings.json. Blank refs
          # already failed at generation time; assert at least one id is bound (HARD gate).
