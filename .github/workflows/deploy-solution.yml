          if [ -z "$HOP_ENV_ID" ]; then
            echo "::error::stage '$STAGE_KEY' is in the derived chain but carries no targetEnvId (GUID-less stage) — refusing to skip it (T-19-23); fix the environment's inventory GUID and re-dispatch"
            exit 1
          fi
          echo "hop $STAGE_KEY -> targetEnvId $HOP_ENV_ID"

          # D-17: THIS hop's bindings only — filter the per-hop-tagged union to this target env.
          jq --arg id "$HOP_ENV_ID" '[ .[] | select(.targetEnvId == $id) ]' bindings-all.json > bindings.json
          if [ "$(jq 'length' bindings.json)" = "0" ]; then
            echo "::error::no bindings tagged for targetEnvId $HOP_ENV_ID (stage '$STAGE_KEY') — the app tags every binding per hop (19-11); tags present: $(jq -r '[ .[].targetEnvId ] | unique | join(", ")' bindings-all.json)"
            exit 1
          fi

