          else
            echo "OI-5 advisory: every bound ConnectionId is visible to the deploy SP in $TARGET_URL"
          fi

      - name: Import to stage with THIS hop's deployment settings   # T7/T8
        uses: microsoft/powerplatform-actions/import-solution@0e44beb5424af932af47250a2568eba4c259e3d8   # v1
        with:
          environment-url: ${{ secrets.PP_URL_STAGE }}
          app-id:        ${{ secrets.PP_APP_ID }}
          client-secret: ${{ secrets.PP_CLIENT_SECRET }}
          tenant-id:     ${{ secrets.PP_TENANT_ID }}
          solution-file: out/patched.zip
          use-deployment-settings-file: true
          deployment-settings-file: DeploymentSettings.json
          run-asynchronously: true          # NOTE: input is `run-asynchronously`, NOT `async`
          max-async-wait-time: 60
          # convert-to-managed: true         # enable for downstream managed deploys

