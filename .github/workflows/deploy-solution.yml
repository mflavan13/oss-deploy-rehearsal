        shell: bash
        env:
          STAGE_KEY: stage
          TARGET_URL: ${{ secrets.PP_URL_STAGE }}
        run: |
          set -euo pipefail
          SECRET_NAME="PP_URL_$(echo "$STAGE_KEY" | tr '[:lower:]' '[:upper:]')"
          # Per-env target URL comes from the per-env-named repo secret (D-21), never the payload.
          if [ -z "$TARGET_URL" ]; then
            echo "::error::secret $SECRET_NAME is not configured but stage '$STAGE_KEY' is in the derived chain — add the repo secret (owner action) before dispatching a chain that traverses this stage"
            exit 1
          fi
          echo '${{ toJSON(github.event.client_payload.chain) }}' > chain.json
          echo '${{ toJSON(github.event.client_payload.bindings) }}' > bindings-all.json

